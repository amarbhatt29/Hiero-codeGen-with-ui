<div class="hero-carousel" data-sly-use.model="com.hiero.design.core.models.HeroCarouselModel" data-carousel-id="${model.id}" data-auto-rotate="${model.enableAutoRotate}" data-rotate-interval="${model.autoRotateInterval}" role="region" aria-label="Hero Carousel">
  <div class="hero-carousel__container" role="presentation">
    <div class="hero-carousel__slides" role="group" aria-roledescription="carousel" aria-label="Carousel slides">
      <div data-sly-repeat.slide="${model.slides}" class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Slide ${slideList.index + 1} of ${model.slides.size}" data-slide-index="${slideList.index}">
        <picture class="hero-carousel__media" data-sly-test="${slide.desktopImage || slide.desktopVideo}">
          <sly data-sly-test="${slide.mobileImage}">
            <source srcset="${slide.mobileImage}" media="(max-width: 767px)" />
          </sly>
          <sly data-sly-test="${slide.desktopImage}">
            <img src="${slide.desktopImage}" alt="${slide.heading || 'Hero slide'}" class="hero-carousel__image" loading="lazy" />
          </sly>
        </picture>
        
        <video class="hero-carousel__video" data-sly-test="${slide.desktopVideo}" muted playsinline>
          <source src="${slide.desktopVideo}" type="video/mp4" />
        </video>

        <div class="hero-carousel__content">
          <h2 class="hero-carousel__heading" data-sly-test="${slide.hasHeading}">${slide.heading}</h2>
          
          <p class="hero-carousel__description" data-sly-test="${slide.hasDescription}">${slide.description}</p>
          
          <div class="hero-carousel__rate-highlight" data-sly-test="${slide.hasRateHighlight}">
            <span class="hero-carousel__rate-text">${slide.rateHighlight}</span>
          </div>
          
          <div class="hero-carousel__actions" data-sly-test="${slide.hasCta}">
            <a href="${slide.ctaLink}" class="hero-carousel__cta" target="${slide.ctaNewTab ? '_blank' : '_self'}" rel="${slide.ctaNewTab ? 'noopener noreferrer' : ''}" data-analytics-event="hero-carousel-cta" data-analytics-label="${slide.ctaLabel}">${slide.ctaLabel}</a>
          </div>
          
          <div class="hero-carousel__disclaimer" data-sly-test="${slide.hasDisclaimer}">
            <p class="hero-carousel__disclaimer-text">${slide.disclaimer}</p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="hero-carousel__controls" data-sly-test="${model.slides.size > 1}">
      <button class="hero-carousel__button hero-carousel__button--prev" aria-label="Previous slide" data-slide-nav="prev" type="button"></button>
      <button class="hero-carousel__button hero-carousel__button--next" aria-label="Next slide" data-slide-nav="next" type="button"></button>
    </div>
    
    <div class="hero-carousel__indicators" data-sly-test="${model.slides.size > 1}" role="group" aria-label="Slide indicators">
      <button data-sly-repeat.indicator="${model.slides}" class="hero-carousel__indicator" data-slide-index="${indicatorList.index}" type="button" aria-label="Go to slide ${indicatorList.index + 1}" aria-pressed="${indicatorList.index == 0}"></button>
    </div>
  </div>
</div>
