<div class="hero-carousel" data-carousel-root>
  <div class="hero-carousel__inner" role="region" aria-label="Hero carousel">
    <div class="hero-carousel__slides">
      <div data-sly-list.slide="${heroCarousel.slides}" class="hero-carousel__slide" role="group" aria-roledescription="slide" aria-label="Slide ${slideList.index + 1} of ${slideList.total}" data-carousel-slide>
        <!-- Desktop Media -->
        <div class="hero-carousel__media hero-carousel__media--desktop" data-carousel-desktop-media>
          <sly data-sly-test="${slide.desktopVideo}">
            <video class="hero-carousel__video" muted playsinline data-carousel-video>
              <source src="${slide.desktopVideo}" type="video/mp4">
              <img src="${slide.desktopImage}" alt="${slide.imageAltText || slide.heading}" class="hero-carousel__image">
            </video>
          </sly>
          <sly data-sly-test="${!slide.desktopVideo && slide.desktopImage}">
            <img src="${slide.desktopImage}" alt="${slide.imageAltText || slide.heading}" class="hero-carousel__image">
          </sly>
        </div>

        <!-- Mobile Media -->
        <div class="hero-carousel__media hero-carousel__media--mobile" data-carousel-mobile-media>
          <sly data-sly-test="${slide.mobileVideo || slide.mobileImage}">
            <sly data-sly-test="${slide.mobileVideo}">
              <video class="hero-carousel__video" muted playsinline data-carousel-video>
                <source src="${slide.mobileVideo}" type="video/mp4">
                <img src="${slide.mobileImage || slide.desktopImage}" alt="${slide.imageAltText || slide.heading}" class="hero-carousel__image">
              </video>
            </sly>
            <sly data-sly-test="${!slide.mobileVideo && (slide.mobileImage || slide.desktopImage)}">
              <img src="${slide.mobileImage || slide.desktopImage}" alt="${slide.imageAltText || slide.heading}" class="hero-carousel__image">
            </sly>
          </sly>
          <sly data-sly-test="${!slide.mobileImage && !slide.mobileVideo && slide.desktopImage}">
            <img src="${slide.desktopImage}" alt="${slide.imageAltText || slide.heading}" class="hero-carousel__image">
          </sly>
        </div>

        <!-- Content Overlay -->
        <div class="hero-carousel__content">
          <div class="hero-carousel__content-inner">
            <sly data-sly-test="${slide.heading}">
              <h2 class="hero-carousel__heading">${slide.heading}</h2>
            </sly>
            <sly data-sly-test="${slide.description}">
              <p class="hero-carousel__description">${slide.description}</p>
            </sly>
            <sly data-sly-test="${slide.rateHighlight}">
              <p class="hero-carousel__rate">${slide.rateHighlight}</p>
            </sly>
            <sly data-sly-test="${slide.hasCta()}">
              <a href="${slide.ctaLink}" class="hero-carousel__cta btn btn--primary" data-carousel-cta>
                ${slide.ctaLabel}
              </a>
            </sly>
            <sly data-sly-test="${slide.disclaimer}">
              <p class="hero-carousel__disclaimer">${slide.disclaimer}</p>
            </sly>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <sly data-sly-test="${heroCarousel.slideCount > 1}">
      <button type="button" class="hero-carousel__nav hero-carousel__nav--prev" aria-label="Previous slide" data-carousel-prev>
        <span class="hero-carousel__nav-icon">‹</span>
      </button>
      <button type="button" class="hero-carousel__nav hero-carousel__nav--next" aria-label="Next slide" data-carousel-next>
        <span class="hero-carousel__nav-icon">›</span>
      </button>

      <!-- Dot Navigation -->
      <div class="hero-carousel__dots" role="group" aria-label="Slide navigation">
        <button data-sly-list.dot="${heroCarousel.slides}" type="button" class="hero-carousel__dot" aria-label="Go to slide ${dotList.index + 1}" aria-current="${dotList.index == 0 ? 'true' : 'false'}" data-carousel-dot data-dot-index="${dotList.index}"></button>
      </div>
    </sly>
  </div>

  <sly data-sly-test="${heroCarousel.shouldAutoRotate()}" data-sly-set="autoRotateInterval=${heroCarousel.autoRotateInterval}">
    <script type="application/json" data-carousel-config>
      {"autoRotate": true, "interval": ${autoRotateInterval}}
    </script>
  </sly>
</div>
