<div class="hero-carousel"
     data-hero-carousel
     data-autoplay="${model.autoplayEnabled}"
     data-autoplay-interval="${model.autoplayInterval}"
     data-slides-count="${model.slides ? model.slides.size : 0}">

  <div class="hero-carousel__track" role="region" aria-label="Hero carousel">
    <div class="hero-carousel__slides">
      <sly data-sly-list.slide="${model.slides}">
        <article class="hero-carousel__slide"
                 role="group"
                 aria-roledescription="slide"
                 aria-label="Slide"
                 tabindex="${slideList.first ? 0 : -1}">
          
          <div class="hero-carousel__media">
            <sly data-sly-test="${slide.hasVideo}">
              <video class="hero-carousel__video" 
                     playsinline 
                     muted 
                     loop
                     aria-hidden="true">
                <source data-sly-test="${slide.desktopVideo}" 
                        src="${slide.desktopVideo}" 
                        media="(min-width: 768px)" 
                        type="video/mp4">
                <source data-sly-test="${slide.mobileVideo}" 
                        src="${slide.mobileVideo}" 
                        type="video/mp4">
              </video>
            </sly>
            
            <sly data-sly-test="${!slide.hasVideo && slide.hasImage}">
              <picture class="hero-carousel__picture">
                <source data-sly-test="${slide.mobileImage}" 
                        srcset="${slide.mobileImage}" 
                        media="(max-width: 767px)">
                <img class="hero-carousel__image" 
                     src="${slide.desktopImage || slide.mobileImage}" 
                     alt="${slide.heading || 'Hero carousel slide'}">
              </picture>
            </sly>
          </div>
          
          <div class="hero-carousel__content">
            <div class="hero-carousel__text-group">
              <sly data-sly-test="${slide.heading}">
                <h2 class="hero-carousel__heading">${slide.heading}</h2>
              </sly>
              
              <sly data-sly-test="${slide.description}">
                <p class="hero-carousel__description">${slide.description}</p>
              </sly>
              
              <sly data-sly-test="${slide.rateHighlight}">
                <div class="hero-carousel__rate">${slide.rateHighlight}</div>
              </sly>
            </div>
            
            <sly data-sly-test="${slide.ctaLabel}">
              <a class="hero-carousel__cta" 
                 href="${slide.ctaLink || '#'}" 
                 target="${slide.ctaTarget || '_self'}"
                 data-analytics-event="hero_carousel_cta"
                 data-analytics-label="${slide.ctaLabel}">
                ${slide.ctaLabel}
              </a>
            </sly>
            
            <sly data-sly-test="${slide.legalCopy}">
              <p class="hero-carousel__legal">${slide.legalCopy}</p>
            </sly>
          </div>
        </article>
      </sly>
    </div>
  </div>
  
  <sly data-sly-test="${model.isShowNavigation && model.slides.size > 1}">
    <div class="hero-carousel__controls" role="group" aria-label="Carousel controls">
      <button class="hero-carousel__nav hero-carousel__nav--prev" 
              type="button" 
              aria-label="Previous slide"
              data-hero-carousel-prev>
        <span class="sr-only">Previous</span>
      </button>
      <button class="hero-carousel__nav hero-carousel__nav--next" 
              type="button" 
              aria-label="Next slide"
              data-hero-carousel-next>
        <span class="sr-only">Next</span>
      </button>
    </div>
    
    <div class="hero-carousel__indicators" role="tablist" aria-label="Slide indicators">
      <sly data-sly-list.indicator="${model.slides}">
        <button class="hero-carousel__indicator"
                type="button"
                role="tab"
                aria-selected="${indicatorList.first}"
                aria-label="Slide"
                data-slide-index="${indicatorList.index}"
                tabindex="${indicatorList.first ? 0 : -1}">
          <span class="sr-only">Slide</span>
        </button>
      </sly>
    </div>
  </sly>
</div>
